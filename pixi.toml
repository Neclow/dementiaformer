[workspace]
authors = ["Neclow <neilclow24@gmail.com>"]
channels = ["conda-forge"]
name = "dementia"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
make_synthetic_data = "python -m pipeline.make_synthetic_data"
build_tokens = "python -m pipeline.build_tokens --config configs/synthetic.yaml"
test = "python -m pytest tests"

[dependencies]
python = "==3.14.7"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.2,<5"
ty = ">=0.0.86,<0.0.87"
pyyaml = ">=6.0.3,<7"

[pypi-dependencies]
transformers = "==5.17"
torch = "==2.13"
numpy = "==2.5"
lightning = "==2.6.6"
polars = ">=2.0.0, <3"

[feature.r.dependencies]
r-base = ">=4.5.3,<4.6"
r-dplyr = ">=1.2.1,<2"
r-arrow = ">=25.0.0,<26"
r-tidyverse = ">=2.0.0,<3"

[feature.r.tasks]
strings = "Rscript pipeline/strings.R configs/synthetic.yaml"
# Step 5a on the synthetic data (pipeline/split.R)
split = "Rscript pipeline/split.R configs/synthetic.yaml"

[environments]
r = { features = ["r"], no-default-feature = true }
