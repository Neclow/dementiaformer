[workspace]
authors = ["Neclow <neilclow24@gmail.com>"]
channels = ["conda-forge"]
name = "dementia"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
build_tokens_all = "python -m pipeline.build_tokens --config configs/data_synthetic.toml"

[dependencies]
python = "==3.14.7"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.2,<5"
ty = ">=0.0.86,<0.0.87"

[pypi-dependencies]
transformers = "==5.17"
torch = "==2.13"
numpy = "==2.5"
lightning = "==2.6.6"
polars = ">=2.0.0, <3"
