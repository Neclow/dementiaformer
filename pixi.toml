[workspace]
authors = ["Neclow"]
channels = ["conda-forge"]
name = "dementia"
platforms = ["linux-64", "win-64"]
version = "0.1.0"

[tasks]
build_tokens = "python -m pipeline.build_tokens"
train_torch = "python -m pipeline.train_torch"
train_lightning = "python -m pipeline.train_lightning"
extract_embeddings = "python -m pipeline.extract_embeddings"
# Tests
test = "python -m pytest tests"
# Benchmarks of speed: results saved in benchmarks/results/<machine>/
benchmark = "python -m pytest benchmarks --benchmark-storage=benchmarks/results --benchmark-autosave"
plot_benchmarks = "python -m plots.plot_benchmarks"

[dependencies]
python = "==3.14.7"
pytest = ">=9.1.1,<10"
pre-commit = ">=4.6.2,<5"
ty = ">=0.0.86,<0.0.87"
pyyaml = ">=6.0.3,<7"
pytest-benchmark = ">=5.3.0,<6"

[pypi-dependencies]
transformers = "==5.17"
torch = "==2.13"
numpy = "==2.5"
lightning = "==2.6.6"
polars = ">=2.0.0, <3"
matplotlib = ">=3.11.2, <4"
seaborn = ">=0.13.2, <0.14"

[feature.r.dependencies]
r-base = ">=4.5.3,<4.6"
r-dplyr = ">=1.2.1,<2"
r-arrow = ">=25.0.0,<26"
r-tidyverse = ">=2.0.0,<3"
r-riskregression = "==2025.5.20"
r-prodlim = "==2025.4.28"
r-glmnet = "==4.1.10"
r-doparallel = ">=1.0.17,<2"

[feature.r.tasks]
# Step 5a on the synthetic data (pipeline/split.R)
split = "Rscript pipeline/split.R"
# Step 7b: the Cox models and scores of 5 predictions.R, on the embeddings
predict = "Rscript pipeline/predict.R"

[environments]
r = { features = ["r"], no-default-feature = true }
